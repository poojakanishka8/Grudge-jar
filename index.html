<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grudge Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button class="sound-toggle" id="soundToggle" title="Toggle sound" aria-label="Toggle sound">🔊</button>

<div class="stage">

  <div class="write-side">
    <div class="eyebrow">grudge jar</div>
    <h1>Get it&nbsp;off<br>your chest.</h1>
    <p class="sub">Write down whatever's bugging you. Crumple it up, toss it in. Empty the jar once a week, on your terms.</p>

    <div class="note-wrap">
      <textarea id="note" placeholder="They took credit for my idea again..." maxlength="240"></textarea>
    </div>

    <div class="actions">
      <button class="toss-btn" id="tossBtn" disabled>Crumple &amp; toss</button>
      <span class="count-line" id="countLine">jar is empty</span>
    </div>

    <div class="empty-row">
      <button class="empty-btn" id="emptyBtn" disabled>empty the jar &rarr;</button>
    </div>
  </div>

  <div class="jar-side">
    <svg class="jar-svg" id="jarSvg" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="jarClip">
          <path d="M 96 130
                   Q 90 130 90 140
                   L 82 380
                   Q 80 400 100 400
                   L 200 400
                   Q 220 400 218 380
                   L 210 140
                   Q 210 130 204 130 Z" />
        </clipPath>
        <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#c9d6bd" stop-opacity="0.22"/>
          <stop offset="12%" stop-color="#ffffff" stop-opacity="0.38"/>
          <stop offset="30%" stop-color="#8fa07a" stop-opacity="0.14"/>
          <stop offset="70%" stop-color="#8fa07a" stop-opacity="0.14"/>
          <stop offset="88%" stop-color="#ffffff" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#5f7350" stop-opacity="0.22"/>
        </linearGradient>
      </defs>

      <!-- lid -->
      <rect x="88" y="96" width="124" height="20" rx="4" fill="#96803c"/>
      <rect x="88" y="96" width="124" height="7" rx="3" fill="#c9a84c"/>
      <g stroke="#7a6a30" stroke-width="1.5" opacity="0.5">
        <line x1="96" y1="100" x2="96" y2="112"/>
        <line x1="112" y1="100" x2="112" y2="112"/>
        <line x1="128" y1="100" x2="128" y2="112"/>
        <line x1="144" y1="100" x2="144" y2="112"/>
        <line x1="160" y1="100" x2="160" y2="112"/>
        <line x1="176" y1="100" x2="176" y2="112"/>
        <line x1="192" y1="100" x2="192" y2="112"/>
        <line x1="204" y1="100" x2="204" y2="112"/>
      </g>
      <rect x="94" y="112" width="112" height="10" rx="3" fill="#b8973f"/>

      <!-- jar body outline -->
      <path d="M 96 130
               Q 90 130 90 140
               L 82 380
               Q 80 400 100 400
               L 200 400
               Q 220 400 218 380
               L 210 140
               Q 210 130 204 130 Z"
            fill="url(#glassGrad)" stroke="#e8ddc0" stroke-opacity="0.55" stroke-width="2"/>

      <!-- fill level rect, height driven by JS -->
      <g clip-path="url(#jarClip)">
        <rect id="fillLevel" x="70" y="400" width="160" height="0" fill="#5f7350" opacity="0.16"/>
        <g id="ballLayer"></g>
      </g>

      <!-- glass highlight -->
      <path d="M 100 140 L 92 375" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>

    <div class="shelf"></div>
    <div class="jar-caption" id="jarCaption">0 grudges jarred</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
